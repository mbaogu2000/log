name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: HOSTNAME
          username: USERNAME
          password: PASSWORD
          local-dir: ./dist/        # 👈 your local folder
          server-dir: /htdocs/